server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets are immutable -> cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never cache the HTML entry point, so deploys are picked up immediately
    # (it references the newly hashed assets).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Route API calls to the backend. Adjust the upstream host to your
    # deployment (e.g. the backend service name in docker compose).
    # location /api/ {
    #     proxy_pass http://backend:8000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # SPA fallback: let React Router handle any unknown path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
