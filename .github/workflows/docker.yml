# Builds both container images and runs the composed stack: catches images that
# build but cannot start (missing runtime deps, broken CMD, bad base tags), a
# broken nginx config, and compose wiring. The API contract itself is checked by
# contract.yml. Complements the docker.yml that python-copier-template renders
# into standalone backend repos.
name: Docker

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the stack (nginx up and backend healthy through it)
        run: timeout 60 bash -c 'until curl -sf http://localhost:8080/api/health > /dev/null; do sleep 2; done'

      - name: "Frontend served"
        run: curl -sf http://localhost:8080/ | grep -q "<title>React Template</title>"

      # Locks in the fallback rule from frontend/docker/nginx.conf: a browser
      # navigating to a client-side route gets the shell, a missing asset does
      # not (a 200 there hides the 404 behind a parse error downstream).
      - name: "SPA fallback: client routes get index.html, missing assets 404"
        run: |
          curl -sf -H 'Accept: text/html' http://localhost:8080/about \
            | grep -q "<title>React Template</title>"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/assets/missing.js)
          echo "missing asset -> $code"
          test "$code" = 404

      # One request is enough to prove the wiring: reaching /health under /api
      # means the image runs and nginx strips the prefix. The endpoints
      # themselves are the Contract workflow's job.
      - name: "Backend reachable through the /api proxy"
        run: |
          body=$(curl -sf http://localhost:8080/api/health)
          echo "$body"
          echo "$body" | jq -e '.status == "ok"'

      - name: Container logs
        if: always()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down
