# Checks for backend/. Kept as a repo-owned workflow because the ones rendered
# from python-copier-template assume the project sits at the repository root.
name: Backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools_scm derives the version from git history
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          working-directory: backend

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check app tests

      - name: Test
        run: uv run pytest
